version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://complaint_user:complaint_pass@db:5432/complaintiq_db
      - CORS_ORIGINS=*
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: complaint_user
      POSTGRES_PASSWORD: complaint_pass
      POSTGRES_DB: complaintiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
